name: Verify Android KR11 font data

on:
  push:
    paths:
      - ci/package_roman_font_data.py
      - .github/workflows/kr11-android-data.yml
  pull_request:
    paths:
      - ci/package_roman_font_data.py
      - .github/workflows/kr11-android-data.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  font-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the pinned released Android data
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release download android-korean-0.51.0-12-kr9-standalone
          --repo munument1/Morrowind-OpenMW-Android-KR
          --pattern OpenMW-Android-0.51.0-12-Korean-Data-KR9.zip
          --dir baseline
      - name: Build KR11 font data and compare all other payloads
        run: >-
          python3 -B ci/package_roman_font_data.py
          --base baseline/OpenMW-Android-0.51.0-12-Korean-Data-KR9.zip
          --base-sha256 4efbdd296b38db31e14e9789cd695ab2cfa936fc76f3be782b638e546030f549
          --output artifacts/OpenMW-Android-0.51.0-12-Korean-Data-KR11.zip
          --platform android-data --android-native
      - uses: actions/upload-artifact@v4
        with:
          name: Android-KR11-Font-Data-Verified
          path: artifacts/*
