name: Publish Android KR9 with original KR8 signing identity
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  verified-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EXPECTED_LIB_SHA256: cf106f05d5292663caef5ee2b4588517a9c0da211674f7571cee5d96f2dc8af9
      EXPECTED_SIGNER_SHA256: 5eea68aceb434506b04f563532460c83330145f3d4ca77ad6ef41792d05985f8
      KR8_APK: OpenMW-Android-0.51.0-12-Korean-KR8-16K.apk
      KR8_DATA: OpenMW-Android-0.51.0-12-Korean-Data-KR8.zip
      KR9_APK: OpenMW-Android-0.51.0-12-Korean-KR9-16K.apk
      KR9_DATA: OpenMW-Android-0.51.0-12-Korean-Data-KR9.zip
      KR9_TAG: android-korean-0.51.0-12-kr9
      NATIVE_RUN: '40514491647'

    steps:
      - uses: actions/checkout@v4

      - name: Require original KR8 signing keystore (never generate a new signing identity)
        shell: bash
        env:
          ORIGINAL_KEYSTORE_BASE64: ${{ secrets.ANDROID_KR8_KEYSTORE_BASE64 }}
          ORIGINAL_STORE_PASSWORD: ${{ secrets.ANDROID_KR8_STORE_PASSWORD }}
          ORIGINAL_KEY_PASSWORD: ${{ secrets.ANDROID_KR8_KEY_PASSWORD }}
          ORIGINAL_KEY_ALIAS: ${{ secrets.ANDROID_KR8_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for value in "$ORIGINAL_KEYSTORE_BASE64" "$ORIGINAL_STORE_PASSWORD" "$ORIGINAL_KEY_PASSWORD" "$ORIGINAL_KEY_ALIAS"; do
            if [[ -z "$value" ]]; then
              echo '::error::Original KR8 keystore credentials must be configured in repository Actions Secrets. No new signing key will be generated.'
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ORIGINAL_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/original-kr8-signing.keystore"
          test -s "$RUNNER_TEMP/original-kr8-signing.keystore"

      - name: Verify released KR8 APK and data and retrieve pinned KR9 native engine
        run: |
          set -euo pipefail
          mkdir -p input native dist staging
          gh release download android-korean-0.51.0-12-kr8 \
            --pattern "$KR8_APK" --pattern "$KR8_APK.sha256" \
            --pattern "$KR8_DATA" --pattern "$KR8_DATA.sha256" \
            --dir input
          for suffix in "$KR8_APK" "$KR8_DATA"; do
            (cd input && sed 's|release-artifacts/||g' "$suffix.sha256" | sha256sum -c -)
          done
          unzip -tq "input/$KR8_APK"
          unzip -tq "input/$KR8_DATA"
          gh run download "$NATIVE_RUN" --name Android-KR9-native-candidate-16K --dir native
          echo "$EXPECTED_LIB_SHA256  native/libopenmw.so" | sha256sum -c -
          test "$(awk 'NR==1{print $1}' native/libopenmw.so.sha256)" = "$EXPECTED_LIB_SHA256"
          grep -Fx 'korean_topic_boundaries=3a2498b52b6ca7358a92ef9a846f462867a323e4' native/korean-origin.txt

      - name: Preserve every KR8 APK resource while staging patched engine
        shell: bash
        run: |
          set -euo pipefail
          expected="$(awk 'NR==1{print $1}' "input/$KR8_APK.sha256")"
          python3 ci/prepare_kr9_apk.py \
            --source "input/$KR8_APK" --library native/libopenmw.so \
            --output staging/kr9-unsigned.apk --expected-source-sha256 "$expected" \
            | tee staging/payload-parity.json
          # Remove only obsolete JAR signing metadata. APK v2 signatures are
          # stored in the ZIP signing block and will be regenerated by apksigner.
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          original=Path('staging/kr9-unsigned.apk')
          dest=Path('staging/kr9-unsigned-clean.apk')
          def is_old_v1_signature(name):
              upper=name.upper()
              if not upper.startswith('META-INF/'):
                  return False
              base=upper.split('/')[-1]
              return base == 'MANIFEST.MF' or base.endswith(('.SF','.RSA','.DSA','.EC'))
          with ZipFile(original) as zin, ZipFile(dest,'w') as zout:
              zout.comment=zin.comment
              for item in zin.infolist():
                  if not is_old_v1_signature(item.filename):
                      zout.writestr(item,zin.read(item))
          print('Removed prior APK v1 signature metadata before signing.')
          PY
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -P 16 -f 4 \
            staging/kr9-unsigned-clean.apk staging/kr9-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 staging/kr9-aligned.apk

      - name: Sign with the original KR8 private key and prove certificate identity
        shell: bash
        env:
          KS_PASS: ${{ secrets.ANDROID_KR8_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KR8_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KR8_KEY_ALIAS }}
        run: |
          set -euo pipefail
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$signer" sign \
            --ks "$RUNNER_TEMP/original-kr8-signing.keystore" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --v1-signing-enabled true --v2-signing-enabled true \
            --out "dist/$KR9_APK" staging/kr9-aligned.apk
          "$signer" verify --verbose --print-certs "dist/$KR9_APK" | tee staging/kr9-signer.txt
          grep -Fiq "Signer #1 certificate SHA-256 digest: $EXPECTED_SIGNER_SHA256" staging/kr9-signer.txt
          "$signer" verify --verbose --print-certs "input/$KR8_APK" > staging/kr8-signer.txt
          grep -Fiq "Signer #1 certificate SHA-256 digest: $EXPECTED_SIGNER_SHA256" staging/kr8-signer.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "dist/$KR9_APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "dist/$KR9_APK" | head -n 1 | tee staging/kr9-package.txt
          grep -Fq "name='com.ast.openmw'" staging/kr9-package.txt
          grep -Fq "versionCode='5112'" staging/kr9-package.txt
          grep -Fq "versionName='0.51.0-12'" staging/kr9-package.txt
          test "$(unzip -p "dist/$KR9_APK" lib/arm64-v8a/libopenmw.so | sha256sum | awk '{print $1}')" = "$EXPECTED_LIB_SHA256"

      - name: Verify all non-signing content remains unchanged from KR8
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from zipfile import ZipFile
          old=os.path.join('input',os.environ['KR8_APK'])
          new=os.path.join('dist',os.environ['KR9_APK'])
          def signing(name):
              upper=name.upper()
              if not upper.startswith('META-INF/'): return False
              base=upper.split('/')[-1]
              return base=='MANIFEST.MF' or base.endswith(('.SF','.RSA','.DSA','.EC'))
          with ZipFile(old) as a, ZipFile(new) as b:
              old_map={n:a.read(n) for n in a.namelist() if not signing(n)}
              new_map={n:b.read(n) for n in b.namelist() if not signing(n)}
              if set(old_map)!=set(new_map):
                  raise SystemExit('Resource list changed beyond signature metadata')
              diffs=[n for n in old_map if old_map[n]!=new_map[n]]
              if diffs!=['lib/arm64-v8a/libopenmw.so']:
                  raise SystemExit(f'Unexpected APK content changes: {diffs!r}')
          print('APK_CONTENT_PARITY=PASS (only native OpenMW engine changed)')
          PY
          cp "input/$KR8_DATA" "dist/$KR9_DATA"
          (cd dist && sha256sum "$KR9_APK" > "$KR9_APK.sha256")
          (cd dist && sha256sum "$KR9_DATA" > "$KR9_DATA.sha256")
          (cd dist && sha256sum -c "$KR9_APK.sha256" && sha256sum -c "$KR9_DATA.sha256")
          test "$(sha256sum "input/$KR8_DATA" | awk '{print $1}')" = "$(sha256sum "dist/$KR9_DATA" | awk '{print $1}')"

      - name: Preserve signed and verified KR9 candidate
        uses: actions/upload-artifact@v4
        with:
          name: Android-0.51.0-12-KR9-same-signer-verified
          path: |
            dist/*.apk
            dist/*.zip
            dist/*.sha256
            staging/payload-parity.json
            staging/kr9-signer.txt
          if-no-files-found: error

      - name: Publish Android KR9 only if authentic signing identity is proven
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$KR9_TAG" >/dev/null 2>&1; then
            echo '::error::KR9 release already exists; refusing overwrite'
            exit 1
          fi
          cat > dist/notes.md <<'EOF'
          ## OpenMW Android 0.51.0-12 Korean KR9

          - Fix incorrect blue topic links inside Korean NPC dialogue, greetings, persuasion and journal text.
          - Keep the Android 0.51.0-12 APK launcher and resources byte-identical; replace only the verified native OpenMW engine.
          - New engine passed 16 KiB ELF alignment and dependency/JNI ABI comparison with published KR8.
          - Android APK retains the **original KR8 signing certificate**, verified by SHA-256; intended for same-package updates.
          - Korean KR8 translation data, including Aradraen CELL fix, remains byte-identical.
          - GitHub Actions ZIP/ELF alignment, APK signature and SHA-256 integrity checks passed.
          - In-game verification was waived by the project owner.
          EOF
          gh release create "$KR9_TAG" \
            "dist/$KR9_APK" "dist/$KR9_APK.sha256" \
            "dist/$KR9_DATA" "dist/$KR9_DATA.sha256" \
            --title 'OpenMW Android 0.51.0-12 Korean KR9 — dialogue and journal hyperlink fix' \
            --notes-file dist/notes.md --target "$GITHUB_SHA" --latest

      - name: Update Android README only after KR9 assets are published
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$KR9_TAG" --json assets --jq '.assets[].name' \
            | grep -Fxq "$KR9_APK"
          gh release view "$KR9_TAG" --json assets --jq '.assets[].name' \
            | grep -Fxq "$KR9_DATA"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          text=p.read_text(encoding='utf-8')
          old='현재 공개된 최신 한국어 배포판은 **OpenMW Android 0.51.0-12 Korean KR8**입니다.'
          new='현재 공개된 최신 한국어 배포판은 **OpenMW Android 0.51.0-12 Korean KR9**입니다.'
          if old not in text and new not in text:
              raise SystemExit('Unexpected Android README version section')
          text=text.replace(old,new)
          text=text.replace('android-korean-0.51.0-12-kr8','android-korean-0.51.0-12-kr9')
          text=text.replace('OpenMW-Android-0.51.0-12-Korean-KR8-16K.apk','OpenMW-Android-0.51.0-12-Korean-KR9-16K.apk')
          text=text.replace('OpenMW-Android-0.51.0-12-Korean-Data-KR8.zip','OpenMW-Android-0.51.0-12-Korean-Data-KR9.zip')
          # Preserve historical information elsewhere; replace only outdated
          # current-release description.
          for line in text.splitlines():
              if line.startswith('KR8은 KR7 대비 한국어 데이터의'):
                  text=text.replace(line,'KR9는 KR8 한국어 번역 데이터를 그대로 유지하면서 NPC 대화·저널 자동 링크 오인식을 수정한 엔진 업데이트입니다. KR8과 동일한 APK 서명 인증서로 검증했습니다.')
          p.write_text(text,encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- README.md; then
            git add README.md
            git commit -m 'docs: point Android README to published KR9 release'
            git push origin HEAD:main
          fi
