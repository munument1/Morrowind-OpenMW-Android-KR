name: Verify Korean spell duration order for Android

on:
  pull_request:
    paths:
      - 'ci/build-korean-native-kr12.sh'
      - 'ci/package-android-kr12.sh'
      - '.github/workflows/verify-kr12-spell-duration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-duration-patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Android build and release provenance gates
        run: |
          set -euo pipefail
          bash -n ci/build-korean-native-kr12.sh ci/package-android-kr12.sh
          grep -Fq "KR12_DURATION_BLOB='325eaf142f727ef1d95e145b3caf8693c53eebd5'" ci/build-korean-native-kr12.sh
          grep -Fq '"spell_duration_order=$KR12_DURATION_BLOB"' ci/build-korean-native-kr12.sh
          grep -Fq 'spell_duration_order=325eaf142f727ef1d95e145b3caf8693c53eebd5' ci/package-android-kr12.sh
          grep -Fq '0013-korean-spell-duration-order.patch' ci/build-korean-native-kr12.sh
      - name: Fetch and verify immutable Windows duration patch
        run: |
          set -euo pipefail
          gh api 'repos/munument1/Morrowind-OpenMW-KR/contents/korean/patches/0013-korean-spell-duration-order.patch?ref=083d73fb8207986a062d843f2b4e5f5503673925' --jq '.content' |
            base64 --decode > duration-order.patch
          test "$(git hash-object duration-order.patch)" = '325eaf142f727ef1d95e145b3caf8693c53eebd5'
      - name: Apply patch to official OpenMW 0.51.0 source
        run: |
          set -euo pipefail
          git clone --depth=1 --branch openmw-0.51.0 https://github.com/OpenMW/openmw.git upstream
          test "$(git -C upstream rev-parse HEAD)" = 'f4bec41444214a7903bebd178389ca22ca13f646'
          git -C upstream apply --check "$GITHUB_WORKSPACE/duration-order.patch"
          git -C upstream apply "$GITHUB_WORKSPACE/duration-order.patch"
          git -C upstream diff --check
          grep -Fq 'durationMarker == "동안" || durationMarker == "지속:"' upstream/apps/openmw/mwgui/widgets.cpp
          grep -Fq 'spellLine += " 동안";' upstream/apps/openmw/mwgui/widgets.cpp
          grep -Fq 'Preserve the original English/game-setting word order' upstream/apps/openmw/mwgui/widgets.cpp
