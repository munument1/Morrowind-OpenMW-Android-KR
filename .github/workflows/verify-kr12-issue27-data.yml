name: Verify KR12.1 translation data fixes

on:
  pull_request:
    paths:
      - 'ci/rebuild_kr12_reported_data.py'
      - '.github/workflows/verify-kr12-issue27-data.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce-data-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the immutable published KR12 baseline
        run: |
          mkdir -p source output
          gh release download 'android-korean-0.51.0-12-kr12-permanent' \
            --repo 'munument1/Morrowind-OpenMW-Android-KR' \
            --pattern 'OpenMW-Android-0.51.0-12-Korean-Data-KR12.zip' --dir source
      - name: Rebuild, verify and retain a candidate only (never republish)
        run: |
          set -euo pipefail
          python3 'ci/rebuild_kr12_reported_data.py' \
            --platform 'android' \
            --source 'source/OpenMW-Android-0.51.0-12-Korean-Data-KR12.zip' \
            --output 'output/KR12.1-android-candidate.zip' \
            --report 'output/KR12.1-android-verification.json'
          unzip -tq 'output/KR12.1-android-candidate.zip'
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('output/KR12.1-android-verification.json').read_text('utf-8'))
          assert report['patched_esp_sha256'] == '0f04a21d69ecae16a1c2ae3bb0b739ac4e71cdb59054c809fc844128e2c12327'
          assert report['record_count_unchanged'] == 48146
          assert len(report['changed_subrecords']) == 4
          assert report['application_range_label'] == '적용: 자신/접촉/대상'
          assert report['pillow_shipment_vanilla_condition_changed'] is False
          assert report['other_zip_members_byte_identical'] is True
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: KR12.1-Android-Verified-Data-Candidate
          path: output/
          if-no-files-found: error
          retention-days: 14
