name: Build and publish Android KR12.2 (GitHub only)

on:
  push:
    branches: [main, 'feature/android-kr12-2-topic-port']
    paths:
      - .github/workflows/release-kr12-2-android.yml
  workflow_dispatch:
    inputs:
      native_run_id:
        description: Repackage the verified native artifact from a successful KR12 build (blank rebuilds native)
        type: string
        default: ''

permissions:
  contents: write
  actions: read

concurrency:
  group: android-kr12-2-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-and-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      JOBS: '4'
      CERT_SHA: ebf75015d1b61b14ffa2a3539d8981434c30272219eb6b0ae0c3de16bb2228f2
      FINAL_APK: OpenMW-Android-0.51.0-12-Korean-KR12.2-Permanent-16K.apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare native toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git curl wget patch unzip zip python3 perl autoconf automake libtool libtool-bin pkg-config bison flex gettext gperf nasm yasm texinfo bzip2 xz-utils
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" 'ndk;27.3.13750724' 'platforms;android-35' 'build-tools;35.0.0'
      - uses: actions/cache@v4
        if: inputs.native_run_id == ''
        with:
          path: |
            source/buildscripts/downloads
            source/buildscripts/prefix/arm64
            source/buildscripts/build/arm64
            !source/buildscripts/build/arm64/openmw-prefix
          key: ${{ runner.os }}-openmw051-r27d-arm64-16k-kr12-${{ hashFiles('source/buildscripts/CMakeLists.txt', 'ci/build-korean-native-kr12-2.sh') }}
          restore-keys: |
            ${{ runner.os }}-openmw051-r27d-arm64-16k-kr12-
            ${{ runner.os }}-openmw051-r27d-arm64-16k-kr11-
            ${{ runner.os }}-openmw051-r27d-arm64-16k-v3-
            ${{ runner.os }}-openmw051-r27d-arm64-16k-v2-
      - name: Recover verified native build for resource-only APK repackaging
        if: inputs.native_run_id != ''
        shell: bash
        env:
          NATIVE_RUN_ID: ${{ inputs.native_run_id }}
        run: |
          set -euo pipefail
          [[ "$NATIVE_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$NATIVE_RUN_ID" > "$RUNNER_TEMP/native-run.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          run=json.loads((Path(os.environ['RUNNER_TEMP'])/'native-run.json').read_text())
          assert run['conclusion']=='success'
          assert run['name']=='Build and publish Android KR12.2 (GitHub only)'
          print('Verified full native build and C++ regressions from pinned KR12 source')
          PY
          gh run download "$NATIVE_RUN_ID" -n Android-KR12.2-native-build-evidence -D native-artifacts
      - name: Compile Android engine with Korean patches 0001 through 0015
        if: inputs.native_run_id == ''
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ci/patch-sdl2-ndk-r27.sh ci/build-korean-native-kr12-2.sh
          ci/patch-sdl2-ndk-r27.sh
          ci/build-korean-native-kr12-2.sh
          grep -Fx 'kr10_engine=munument1/Morrowind-OpenMW-KR@22410f633d4de10aaeb8345238a15d45a7f24ca3' native-artifacts/korean-origin.txt
          grep -Fx 'voice_subtitle_sync=9ccc477acf8488bf3b93e5b64b897ddb8a7f52af' native-artifacts/korean-origin.txt
          grep -Fx 'topic_link_fix=1f40a0952d193b4ba68cb4f6ffa08091233353f8' native-artifacts/korean-origin.txt
          grep -Fx 'legacy_topic_recovery=1f31cccb299d8fd3b8895fcd0523775207c3355c' native-artifacts/korean-origin.txt
          grep -Fx 'spell_duration_order=325eaf142f727ef1d95e145b3caf8693c53eebd5' native-artifacts/korean-origin.txt
      - name: Run real topic recovery and journal index C++ regressions on Android-patched source
        if: inputs.native_run_id == ''
        shell: bash
        run: |
          set -euo pipefail
          src=source/buildscripts/build/arm64/openmw-prefix/src/openmw
          mkdir -p regression
          for test in test-journal-index.cpp test-legacy-korean-name.cpp test-legacy-korean-topic.cpp test-korean-topic-markup.cpp test-voice-subtitle-lifetime.cpp; do
            gh api "repos/munument1/Morrowind-OpenMW-KR/contents/packaging/korean/tooling/$test?ref=3d974fcdb473b248cf729a5b8bd873797e9bd18e" --jq '.content' | base64 --decode > "regression/$test"
            g++ -std=c++20 -O2 -I"$src" "regression/$test" -o "regression/${test%.cpp}"
            "regression/${test%.cpp}"
          done
      - name: Assemble non-debuggable APK with complete native payload and verify 16 KiB layout
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ci/package-android-kr12-2.sh
          NATIVE_INPUT=native-artifacts ci/package-android-kr12-2.sh
      - name: Recover backed-up signing identity without exposing private material
        shell: bash
        env:
          ENC_KEYSTORE: ${{ secrets.ANDROID_KR11_ENCRYPTED_KEYSTORE_JSON }}
          KEY_HEX: ${{ secrets.ANDROID_KR11_SIGNING_KEY_HEX }}
        run: |
          set -euo pipefail
          test -n "$ENC_KEYSTORE"
          test -n "$KEY_HEX"
          python3 -m venv "$RUNNER_TEMP/signing-venv"
          "$RUNNER_TEMP/signing-venv/bin/pip" --quiet install cryptography==46.0.4
          "$RUNNER_TEMP/signing-venv/bin/python" - <<'PY'
          import os,json,base64,zlib
          from pathlib import Path
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          payload=json.loads(os.environ['ENC_KEYSTORE'])
          assert payload['certificate_sha256']==os.environ['CERT_SHA']
          obj=json.loads(zlib.decompress(AESGCM(bytes.fromhex(os.environ['KEY_HEX'])).decrypt(base64.b64decode(payload['nonce_base64']),base64.b64decode(payload['ciphertext_base64']),b'openmw-korean-android-signing-v1')))
          assert obj['package']=='com.ast.openmw.korean'
          assert obj['certificate_sha256']==os.environ['CERT_SHA']
          tmp=Path(os.environ['RUNNER_TEMP'])
          for name,data in [('release.p12',base64.b64decode(obj['keystore_base64'])),('release-password.txt',obj['keystore_password'].encode())]:
              path=tmp/name;path.write_bytes(data);path.chmod(0o600)
          print('Signing identity recovered; private material withheld.')
          PY
      - name: Align and permanently sign KR12 APK
        shell: bash
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/zipalign" -P 16 -f 4 release-artifacts/OpenMW-Android-0.51.0-12-Korean-KR12.2-Unsigned-16K.apk "$RUNNER_TEMP/aligned.apk"
          export KS_PASS="$(cat "$RUNNER_TEMP/release-password.txt")"
          echo "::add-mask::$KS_PASS"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 --ks-key-alias morrowind-openmw-korean-android --ks-pass env:KS_PASS --key-pass env:KS_PASS --v1-signing-enabled true --v2-signing-enabled true --out "release-artifacts/$FINAL_APK" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose --print-certs "release-artifacts/$FINAL_APK" > release-artifacts/kr12-certificate.txt
          grep -Fi "Signer #1 certificate SHA-256 digest: $CERT_SHA" release-artifacts/kr12-certificate.txt
          "$tools/zipalign" -c -P 16 4 "release-artifacts/$FINAL_APK"
          "$tools/aapt" dump badging "release-artifacts/$FINAL_APK" > release-artifacts/kr12-badging.txt
          grep -F "name='com.ast.openmw.korean'" release-artifacts/kr12-badging.txt
          grep -F "versionCode='5116'" release-artifacts/kr12-badging.txt
          if grep -Fq 'application-debuggable' release-artifacts/kr12-badging.txt; then exit 1; fi
          test "$(unzip -p "release-artifacts/$FINAL_APK" lib/arm64-v8a/libopenmw.so | sha256sum | awk '{print $1}')" = "$(awk 'NR==1{print $1}' native-artifacts/libopenmw.so.sha256)"
          (cd release-artifacts && sha256sum "$FINAL_APK" > "$FINAL_APK.sha256")
      - name: Retain signed candidate and public verification
        uses: actions/upload-artifact@v4
        with:
          name: Android-KR12.2-Signed-Verified
          path: |
            release-artifacts/*-Permanent-16K.apk
            release-artifacts/*-Permanent-16K.apk.sha256
            release-artifacts/16k-verification.txt
            release-artifacts/kr12-certificate.txt
            release-artifacts/kr12-badging.txt
            release-artifacts/*page-size-report.txt
            native-artifacts/korean-origin.txt
            native-artifacts/libopenmw.so.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Retain build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-KR12.2-native-build-evidence
          path: native-artifacts/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
      - name: Remove private runner signing files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/release.p12" "$RUNNER_TEMP/release-password.txt" "$RUNNER_TEMP/aligned.apk"

  release-kr12-2-android-github:
    if: github.ref == 'refs/heads/main'
    needs: native-and-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: android-korean-0.51.0-12-kr12.2-permanent
      BASE_TAG: android-korean-0.51.0-12-kr12.1-permanent
      BASE_DATA: OpenMW-Android-0.51.0-12-Korean-Data-KR12.1.zip
      FINAL_DATA: OpenMW-Android-0.51.0-12-Korean-Data-KR12.2.zip
      FINAL_APK: OpenMW-Android-0.51.0-12-Korean-KR12.2-Permanent-16K.apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refuse overwriting an existing signed KR12.2 release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Android KR12.2 release already exists"
            exit 1
          fi
      - name: Download signed APK and native provenance from this build
        uses: actions/download-artifact@v4
        with:
          name: Android-KR12.2-Signed-Verified
          path: output
      - name: Build KR12.2 Android translation data from pinned public KR12
        run: |
          set -euo pipefail
          mkdir -p source output
          gh release download "$BASE_TAG" --pattern "$BASE_DATA" --dir source
          python3 ci/rebuild_android_kr12_2_quest_data.py \
            --source "source/$BASE_DATA" \
            --output "output/$FINAL_DATA" \
            --report output/KR12.2-Android-Data-verification.json
          python3 - <<'PY'
          import json
          p=json.load(open('output/KR12.2-Android-Data-verification.json'))
          assert p['source_esp_sha256']=='0f04a21d69ecae16a1c2ae3bb0b739ac4e71cdb59054c809fc844128e2c12327'
          assert p['changed_info_count']==4
          assert len(p['changes'])==4
          assert all(x['visible_text_unchanged'] for x in p['changes'])
          assert p['all_other_records_and_fields_unchanged'] is True
          assert p['unchanged_android_zip_members_byte_identical'] is True
          PY
          (cd output && sha256sum "$FINAL_DATA" > "$FINAL_DATA.sha256")
      - name: Independently check APK signing, patch provenance, version, ZIPs
        run: |
          set -euo pipefail
          test -s "output/$FINAL_APK"
          (cd output && sha256sum -c "$FINAL_APK.sha256" && sha256sum -c "$FINAL_DATA.sha256")
          unzip -tq "output/$FINAL_DATA"
          unzip -tq "output/$FINAL_APK"
          grep -Fx 'spell_duration_order=325eaf142f727ef1d95e145b3caf8693c53eebd5' output/korean-origin.txt
          grep -Fi 'Signer #1 certificate SHA-256 digest: ebf75015d1b61b14ffa2a3539d8981434c30272219eb6b0ae0c3de16bb2228f2' output/kr12-certificate.txt
          grep -F "versionCode='5116'" output/kr12-badging.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Android-KR12.2-Verified-GitHub-Release
          path: output/
          retention-days: 30
      - name: Publish Android KR12.2 exclusively to GitHub Releases
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Concurrent Android KR12.2 tag exists; refusing overwrite"
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          ## OpenMW Android 0.51.0-12 Korean KR12.2
          - **Signed standalone Android APK** with versionCode 5116, permanent signing identity, 16 KiB ELF and ZIP alignment.
          - Windows KR12.3의 한국어 인용 조사·명사형 토픽 경계 패치와 퀘스트 대사 링크 4건을 이식했습니다.
          - Android KR12.1의 마법 표시·Firemoth 지명·데이드릭 글꼴·자막은 유지합니다.
          - Updated Korean spell-effect UI: `지속: 30초`, `적용: 자신 / 접촉 / 대상`, Light effect `빛`.
          - Fixed the Dro'Sakhar bounty dialogue hyperlink and added ten official Firemoth interior cell aliases to the separate data ZIP.
          - `pillow shipment` remains unchanged and is deferred to the Patch for Purists translation.
          - The native engine and Korean data are rebuilt and checked against pinned sources and hashes. In-game reports are still welcome.

          Download **both** the APK and KR12.2 data ZIP. This Android version is **only** distributed via GitHub Releases, **not Nexus Mods**.
          EOF
          gh release create "$TAG" \
            "output/$FINAL_APK" "output/$FINAL_APK.sha256" \
            "output/$FINAL_DATA" "output/$FINAL_DATA.sha256" \
            output/KR12.2-Android-Data-verification.json \
            output/korean-origin.txt output/kr12-certificate.txt \
            output/libopenmw.so.sha256 output/16k-verification.txt \
            --title 'OpenMW Android 0.51.0-12 Korean KR12.2 — signed update' \
            --notes-file release-notes.md --target "$GITHUB_SHA" --latest
