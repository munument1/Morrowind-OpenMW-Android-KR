name: Publish Android 0.51.0-12 Korean release
on:
  push:
    branches:
      - feature/android-05112-kr6-sync
    paths:
      - .github/workflows/publish-android-05112-kr6.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: android-korean-0.51.0-12-kr6
    steps:
      - uses: actions/checkout@v4
      - name: Download verified APK and KR6 data artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/apk dist/data
          gh run download 39542186583 --repo "$GITHUB_REPOSITORY" --name OpenMW-Android-0.51.0-12-Korean-APK-Candidate-16K --dir dist/apk
          gh run download 39529895733 --repo "$GITHUB_REPOSITORY" --name OpenMW-Android-0.51.0-12-Korean-Data-KR6-candidate --dir dist/data
          test -s dist/apk/OpenMW-Android-0.51.0-12-Korean-KR6-Candidate-16K.apk
          test -s dist/data/OpenMW-Android-0.51.0-12-Korean-Data-KR6.zip
          (cd dist/apk && sha256sum -c OpenMW-Android-0.51.0-12-Korean-KR6-Candidate-16K.apk.sha256)
          (cd dist/data && sha256sum -c OpenMW-Android-0.51.0-12-Korean-Data-KR6.zip.sha256)
          grep -Fx 'result=PASS' dist/data/korean-data-verification.txt
          grep -Fq 'zipalign_16k=PASS' dist/apk/16k-verification.txt
          unzip -tq dist/data/OpenMW-Android-0.51.0-12-Korean-Data-KR6.zip
      - name: Publish release and attach APK and KR6 data
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite."
            exit 1
          fi
          cat > /tmp/release-notes.md <<'EOF'
          OpenMW Android 0.51.0-12 한국어 버전.

          - Android 0.51.0-12 기반 한국어 APK (ARM64, 16 KiB 정렬 검증)
          - PC OpenMW KR6 한국어 데이터 별도 ZIP 제공
          - 한국어 대화/일지 처리를 위한 기존 네이티브 패치 포함

          설치: APK 설치 후, KR6 데이터 ZIP을 별도로 게임 데이터에 적용하세요. APK만으로 모든 모로윈드 콘텐츠가 번역되는 것은 아닙니다.

          검증: GitHub Actions 네이티브 컴파일, APK 조립, ZIP SHA-256, 16 KiB ELF/ZIP 정렬 검증 통과. 실제 기기 실행은 별도 확인 필요.
          EOF
          gh release create "$TAG" \
            dist/apk/OpenMW-Android-0.51.0-12-Korean-KR6-Candidate-16K.apk \
            dist/apk/OpenMW-Android-0.51.0-12-Korean-KR6-Candidate-16K.apk.sha256 \
            dist/data/OpenMW-Android-0.51.0-12-Korean-Data-KR6.zip \
            dist/data/OpenMW-Android-0.51.0-12-Korean-Data-KR6.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "OpenMW Android 0.51.0-12 Korean KR6 (16 KiB)" \
            --notes-file /tmp/release-notes.md \
            --latest
